<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شغلانتنا - وظائف مصر</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        
        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 { font-size: 2em; }
        header p { opacity: 0.8; margin-top: 5px; }
        
        .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }
        
        .job-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-right: 5px solid #2c3e50;
        }
        
        .job-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .job-title a {
            color: #2c3e50;
            text-decoration: none;
        }
        
        .job-title a:hover { color: #e74c3c; }
        
        .job-meta {
            display: flex;
            gap: 15px;
            color: #777;
            font-size: 0.9em;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .job-meta span { display: flex; align-items: center; gap: 5px; }
        
        .job-type {
            display: inline-block;
            background: #e8f4fd;
            color: #2980b9;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 8px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #777;
            font-size: 1.2em;
        }
        
        .update-time {
            text-align: center;
            color: #999;
            font-size: 0.85em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>🧳 شغلانتنا</h1>
    <p>أحدث الوظائف في مصر يومياً</p>
</header>

<div class="container">
    <div class="update-time" id="update-time"></div>
    <div id="jobs-container">
        <div class="loading">⏳ جاري تحميل الوظائف...</div>
    </div>
</div>

<script>
fetch('jobs.json')
    .then(res => res.json())
    .then(jobs => {
        const container = document.getElementById('jobs-container');
        const timeDiv = document.getElementById('update-time');
        
        if (jobs.length === 0) {
            container.innerHTML = '<div class="loading">لا توجد وظائف حالياً</div>';
            return;
        }
        
        timeDiv.textContent = `إجمالي الوظائف: ${jobs.length} وظيفة`;
        
        container.innerHTML = jobs.map(job => `
            <div class="job-card">
                ${job.type ? `<span class="job-type">${job.type}</span>` : ''}
                <div class="job-title">
                    <a href="${job.link}" target="_blank">${job.title}</a>
                </div>
                ${job.excerpt ? `<p style="color:#555; font-size:0.9em">${job.excerpt}</p>` : ''}
                <div class="job-meta">
                    ${job.location ? `<span>📍 ${job.location}</span>` : ''}
                    ${job.date ? `<span>📅 ${job.date}</span>` : ''}
                </div>
            </div>
        `).join('');
    })
    .catch(() => {
        document.getElementById('jobs-container').innerHTML = 
            '<div class="loading">❌ تعذر تحميل الوظائف</div>';
    });
</script>

</body>
</html>
